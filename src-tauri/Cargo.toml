[package]
name = "life-os-habit-tracker"
version = "0.1.0"
description = "A simple offline checkbox habit tracker"
authors = ["siddh"]
edition = "2021"

[lib]
name = "life_os_habit_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
thiserror = "1"
